server:
  port: 8080

spring:
  application:
    name: rms-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Mọi cột thời gian lưu UTC. connectionTimeZone=+00:00 (%2B là dấu +): driver coi phiên là UTC;
    # forceConnectionTimeZoneToSession=true: driver còn SET time_zone của phiên MySQL về +00:00,
    # nên DEFAULT CURRENT_TIMESTAMP / ON UPDATE do MySQL tự điền cũng là UTC (không theo giờ máy).
    # Dùng offset chứ không dùng tên "UTC": MySQL chưa nạp bảng múi giờ sẽ từ chối SET time_zone='UTC'.
    url: jdbc:mysql://${RMS_MYSQL_HOST:127.0.0.1}:${RMS_MYSQL_PORT:3306}/${RMS_MYSQL_DATABASE:rms_db}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true
    username: ${RMS_MYSQL_USER:rms_learn}
    password: ${RMS_MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

rms:
  # Múi giờ nhà hàng: dashboard cắt ngày và tính giờ cao điểm theo vùng này (DB vẫn lưu UTC).
  time-zone: ${RMS_TIME_ZONE:Asia/Ho_Chi_Minh}
  reservation:
    # Lượt đặt CONFIRMED quá giờ bắt đầu bao nhiêu phút mà chưa check-in thì tự chuyển NO_SHOW.
    no-show-grace-minutes: ${RMS_NO_SHOW_GRACE_MINUTES:30}
    # Chu kỳ quét lượt đặt quá hạn (PENDING quá giờ → CANCELLED, CONFIRMED vắng mặt → NO_SHOW).
    sweep-interval-ms: 60000
  security:
    jwt-secret: ${RMS_JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 30
  storage:
    menu-dir: ${RMS_MENU_DIR:uploads/menu}