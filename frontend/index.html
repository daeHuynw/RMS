<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — RMS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <form id="login-form" class="card">
        <h1>Đăng nhập</h1>
        <p class="muted">Restaurant Management System</p>
        <p id="error" class="error" hidden></p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="an@example.com" required />
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" required />
        <button type="submit">Đăng nhập</button>
        <p class="muted" style="margin-top: 16px">
          Chưa có tài khoản? <a href="/register.html">Đăng ký</a>
          · <a href="/home.html">Trang chủ</a>
          · <a href="/menu.html">Thực đơn</a>
        </p>
      </form>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
