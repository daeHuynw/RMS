<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt bàn — RMS</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
    <link rel="stylesheet" href="/src/styles/reservations.css" />
  </head>
  <body>
    <main class="page admin-page">
      <section class="card admin-shell">
        <header class="admin-header">
          <div>
            <h1>Đặt bàn</h1>
            <p class="muted">Chọn giờ · bàn trống · gửi yêu cầu</p>
          </div>
          <nav class="admin-nav">
            <a href="/menu.html">Thực đơn</a>
            <a href="/profile.html">Hồ sơ</a>
            <a href="/">Trang chủ</a>
          </nav>
        </header>

        <p id="error" class="error" hidden></p>
        <p id="ok" class="ok" hidden></p>

        <div class="admin-grid admin-grid-2">
          <div class="admin-panel">
            <h2>Tìm bàn trống</h2>
            <form id="search-form">
              <label for="start">Bắt đầu</label>
              <input id="start" type="datetime-local" required />
              <label for="end">Kết thúc</label>
              <input id="end" type="datetime-local" required />
              <label for="guestCount">Số khách</label>
              <input id="guestCount" type="number" min="1" value="2" required />
              <label for="specialRequest">Ghi chú</label>
              <textarea id="specialRequest" maxlength="500"></textarea>
              <button type="submit" style="margin-top: 16px">Xem bàn trống</button>
            </form>
            <div id="availability" class="avail-list" hidden></div>
          </div>

          <div class="admin-panel">
            <h2>Đặt bàn của tôi</h2>
            <p id="loading" class="muted">Đang tải…</p>
            <div id="mine-list"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/pages/reservations/reservations.js"></script>
  </body>
</html>
