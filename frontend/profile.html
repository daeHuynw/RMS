<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ — RMS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Hồ sơ</h1>
        <p id="roles" class="muted"></p>
        <p id="error" class="error" hidden></p>
        <p id="ok" class="muted" hidden></p>

        <form id="profile-form">
          <label for="fullName">Họ tên</label>
          <input id="fullName" name="fullName" required maxlength="150" />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" disabled />
          <label for="phone">Số điện thoại</label>
          <input id="phone" name="phone" maxlength="20" />
          <button type="submit">Lưu hồ sơ</button>
        </form>

        <form id="password-form" style="margin-top: 24px">
          <h2 style="font-size: 1.1rem; margin: 0">Đổi mật khẩu</h2>
          <label for="currentPassword">Mật khẩu hiện tại</label>
          <input id="currentPassword" name="currentPassword" type="password" required />
          <label for="newPassword">Mật khẩu mới</label>
          <input id="newPassword" name="newPassword" type="password" required minlength="8" />
          <button type="submit">Đổi mật khẩu</button>
        </form>

        <p class="muted" style="margin-top: 16px">
          <a href="/">Trang chủ</a> · <a href="/menu.html">Thực đơn</a> · <a href="/reservations.html">Đặt bàn</a>
        </p>
      </section>
    </main>
    <script type="module" src="/src/pages/auth/profile.js"></script>
  </body>
</html>
