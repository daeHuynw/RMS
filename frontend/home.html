<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <main class="home">
      <section class="home-hero">

    <button type="button" class="to-top" aria-label="Lên đầu trang">↑</button>
    <script type="module" src="/src/pages/home.js"></script>
