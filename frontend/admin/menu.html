<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Món — RMS</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
  </head>
  <body>
    <main class="page admin-page">
      <section class="card admin-shell">
        <header class="admin-header">
          <div>
            <h1>Món ăn</h1>
            <p class="muted">CRUD món + upload ảnh</p>
          </div>
          <nav class="admin-nav">
            <a href="/admin/categories.html">Danh mục</a>
            <a href="/menu.html">Xem thực đơn</a>
            <a href="/">Trang chủ</a>
          </nav>
        </header>

        <p id="error" class="error" hidden></p>
        <p id="ok" class="ok" hidden></p>

        <div class="admin-grid admin-grid-2">
          <div class="admin-panel">
            <h2 id="form-title">Thêm món</h2>
            <form id="item-form">
              <input type="hidden" id="itemId" />
              <label for="categoryId">Danh mục</label>
              <select id="categoryId" name="categoryId" required></select>
              <label for="name">Tên món</label>
              <input id="name" name="name" required maxlength="150" />
              <label for="description">Mô tả</label>
              <textarea id="description" name="description" maxlength="1000"></textarea>
              <label for="price">Giá (VND)</label>
              <input id="price" name="price" type="number" min="0" step="1000" required />
              <label for="status">Trạng thái</label>
              <select id="status" name="status">
                <option value="AVAILABLE">AVAILABLE</option>
                <option value="UNAVAILABLE">UNAVAILABLE</option>
              </select>
              <div class="admin-actions" style="margin-top: 16px">
                <button type="submit">Lưu món</button>
                <button type="button" id="reset-btn" class="btn-secondary">Hủy sửa</button>
              </div>
            </form>

            <form id="image-form" style="margin-top: 24px" hidden>
              <h2 style="font-size: 1.05rem; margin: 0">Ảnh món đang sửa</h2>
              <p id="image-hint" class="muted"></p>
              <label for="file">Chọn ảnh (JPG/PNG/WEBP ≤ 2MB)</label>
              <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp" required />
              <button type="submit" style="margin-top: 12px">Upload ảnh</button>
            </form>
          </div>

          <div class="admin-panel">
            <h2>Danh sách món</h2>
            <p id="loading" class="muted">Đang tải…</p>
            <table class="admin-table" id="item-table" hidden>
              <thead>
                <tr>
                  <th>Ảnh</th>
                  <th>Món</th>
                  <th>Giá</th>
                  <th>TT</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="item-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/pages/admin/menu.js"></script>
  </body>
</html>
