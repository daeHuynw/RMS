<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Giảm giá — RMS</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
  </head>
  <body>
    <main class="page admin-page">
      <section class="card admin-shell">
        <header class="admin-header">
          <div>
            <h1>Mã giảm giá</h1>
            <p class="muted">FIXED_AMOUNT / PERCENTAGE · hạn dùng · giới hạn lượt</p>
          </div>
          <nav class="admin-nav">
            <a href="/admin/menu.html">Món</a>
            <a href="/admin/categories.html">Danh mục</a>
            <a href="/admin/tables.html">Bàn</a>
            <a href="/">Trang chủ</a>
          </nav>
        </header>

        <p id="error" class="error" hidden></p>
        <p id="ok" class="ok" hidden></p>

        <div class="admin-grid admin-grid-2">
          <div class="admin-panel">
            <h2 id="form-title">Thêm mã</h2>
            <form id="discount-form">
              <input type="hidden" id="discountId" />
              <label for="code">Mã</label>
              <input id="code" required maxlength="40" placeholder="SUMMER10" />
              <label for="description">Mô tả</label>
              <textarea id="description" maxlength="500"></textarea>
              <label for="type">Loại</label>
              <select id="type" required>
                <option value="PERCENTAGE">PERCENTAGE (%)</option>
                <option value="FIXED_AMOUNT">FIXED_AMOUNT (VND)</option>
              </select>
              <label for="value">Giá trị</label>
              <input id="value" type="number" min="0.01" step="0.01" required />
              <label for="minimumOrderAmount">Đơn tối thiểu</label>
              <input id="minimumOrderAmount" type="number" min="0" step="0.01" />
              <label for="maximumDiscountAmount">Giảm tối đa</label>
              <input id="maximumDiscountAmount" type="number" min="0" step="0.01" />
              <label for="usageLimit">Giới hạn lượt (trống = không giới hạn)</label>
              <input id="usageLimit" type="number" min="1" step="1" />
              <label for="startAt">Bắt đầu</label>
              <input id="startAt" type="datetime-local" required />
              <label for="endAt">Kết thúc</label>
              <input id="endAt" type="datetime-local" required />
              <div class="admin-actions" style="margin-top: 16px">
                <button type="submit">Lưu</button>
                <button type="button" id="reset-btn" class="btn-secondary">Hủy sửa</button>
              </div>
            </form>
          </div>

          <div class="admin-panel">
            <h2>Danh sách</h2>
            <p id="loading" class="muted">Đang tải…</p>
            <table class="admin-table" id="discount-table" hidden>
              <thead>
                <tr>
                  <th>Mã</th>
                  <th>Loại</th>
                  <th>Dùng</th>
                  <th>TT</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="discount-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/pages/admin/discounts.js"></script>
  </body>
</html>
